name: Backward Compatibility

on:
  pull_request:
    paths:
      - "bcc-enterprise-demo/specs/**"
      - "bcc-enterprise-demo/scripts/**"
      - ".github/workflows/bcc.yml"

jobs:
  openapi-bcc:
    name: BCC / OpenAPI baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pull request base branch
        run: |
          git fetch origin \
            "refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          git rev-parse "origin/${{ github.event.pull_request.base.ref }}"

      - name: Run OpenAPI BCC
        run: |
          docker run --rm \
            -v "${PWD}:/usr/src/app" \
            -w /usr/src/app \
            specmatic/specmatic:demo \
            backward-compatibility-check \
            --base-branch origin/${{ github.event.pull_request.base.ref }} \
            --target-path bcc-enterprise-demo/specs/baseline/openapi
