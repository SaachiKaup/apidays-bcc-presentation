name: Backward Compatibility

on:
  pull_request:
    paths:
      - "bcc-enterprise-demo/specs/**"
      - "bcc-enterprise-demo/scripts/**"
      - ".github/workflows/bcc.yml"

jobs:
  openapi-bcc:
    name: BCC / OpenAPI baseline
    runs-on: ubuntu-latest
    environment: SPECMATIC_LICENSE_ENV
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pull request base branch
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          git rev-parse "origin/${{ github.event.pull_request.base.ref }}"

      - name: Create Specmatic license file
        env:
          SPECMATIC_LICENSE: ${{ secrets.SPECMATIC_LICENSE }}
        run: |
          printf '%s' "$SPECMATIC_LICENSE" > bcc-enterprise-demo/license.txt

      - name: Verify Git baseline is visible to Docker
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${PWD}:/workspace" \
            -w /workspace \
            --entrypoint git \
            specmatic/enterprise:latest \
            rev-parse "origin/${{ github.event.pull_request.base.ref }}"

      - name: Run OpenAPI BCC
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${PWD}:/workspace" \
            -v "${PWD}/bcc-enterprise-demo/license.txt:/specmatic/specmatic-license.txt:ro" \
            -w /workspace \
            -e SPECMATIC_LICENSE_PATH=/specmatic/specmatic-license.txt \
            specmatic/enterprise:latest \
            backward-compatibility-check \
            --base-branch origin/${{ github.event.pull_request.base.ref }} \
            --repo-dir /workspace \
            --target-path bcc-enterprise-demo/specs/baseline/openapi
