name: Backward Compatibility

on:
  pull_request:
    paths:
      - "bcc-enterprise-demo/specs/**"
      - "bcc-enterprise-demo/docker-compose.yml"
      - ".github/workflows/bcc.yml"

jobs:
  openapi-bcc:
    name: OpenAPI backward compatibility
    runs-on: ubuntu-latest
    environment: SPECMATIC_LICENSE_ENV

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run OpenAPI BCC
        env:
          SPECMATIC_LICENSE: ${{ secrets.SPECMATIC_LICENSE }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -eu
          LICENSE_FILE="$RUNNER_TEMP/specmatic-license.txt"
          cleanup() {
            rm -f "$LICENSE_FILE"
          }
          trap cleanup EXIT

          git fetch origin \
            "refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          git rev-parse "origin/$BASE_BRANCH"
          printf '%s' "$SPECMATIC_LICENSE" > "$LICENSE_FILE"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$LICENSE_FILE:/specmatic/specmatic-license.txt:ro" \
            -w /workspace \
            -e SPECMATIC_LICENSE_PATH=/specmatic/specmatic-license.txt \
            specmatic/enterprise:latest \
            backward-compatibility-check \
            --base-branch "origin/$BASE_BRANCH" \
            --target-path bcc-enterprise-demo/specs/baseline/openapi/orders.yaml
