name: Backward Compatibility

on:
  pull_request:
    paths:
      - "bcc-enterprise-demo/specs/**"
      - "bcc-enterprise-demo/docker-compose.yml"
      - ".github/workflows/bcc.yml"

jobs:
  openapi-bcc:
    name: OpenAPI backward compatibility
    runs-on: ubuntu-latest
    environment: SPECMATIC_LICENSE_ENV

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pull request base branch
        run: |
          git fetch origin \
            "refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          git rev-parse "origin/${{ github.event.pull_request.base.ref }}"

      - name: Create Specmatic license file
        env:
          SPECMATIC_LICENSE: ${{ secrets.SPECMATIC_LICENSE }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -eu
          TEMP_REPO=$(mktemp -d "$RUNNER_TEMP/bcc-repository.XXXXXX")
          cleanup() {
            rm -rf "$TEMP_REPO"
          }
          trap cleanup EXIT

          # Preserve the complete checkout, including .git and its credentials.
          cp -a "$GITHUB_WORKSPACE/." "$TEMP_REPO/"

          git -C "$TEMP_REPO" fetch origin \
            "refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          git -C "$TEMP_REPO" rev-parse "origin/$BASE_BRANCH"

          printf '%s' "$SPECMATIC_LICENSE" \
            > "$TEMP_REPO/bcc-enterprise-demo/license.txt"

          docker compose \
            -f "$TEMP_REPO/bcc-enterprise-demo/docker-compose.yml" \
            run --rm \
            --entrypoint specmatic \
            bcc \
            backward-compatibility-check \
            --base-branch "origin/$BASE_BRANCH" \
            --repo-dir /workspace \
            --target-path bcc-enterprise-demo/specs/baseline/openapi/orders.yaml
