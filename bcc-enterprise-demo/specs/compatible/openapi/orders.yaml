openapi: 3.0.3
info:
  title: Order History API
  version: 1.1.0
servers:
  - url: https://orders.example.test
security:
  - bearerAuth: []
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List orders for a customer with optional pagination
      parameters:
        - name: customerId
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: skip
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Get one order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Authentication required
    OrderNotFound:
      description: Order does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    OrderList:
      type: array
      items:
        $ref: '#/components/schemas/Order'
    Order:
      type: object
      required: [id, customerId, status, total]
      properties:
        id:
          type: string
        customerId:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        total:
          type: number
          format: double
        currency:
          type: string
    OrderStatus:
      type: string
      enum: [PENDING, ACCEPTED, SHIPPED, DELIVERED, CANCELLED]
    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
