openapi: 3.0.3
info:
  title: Customer Orders API
  version: 1.1.0
servers:
  - url: https://orders.example.test
security:
  - bearerAuth: []
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List orders for a customer
      parameters:
        - name: customerId
          in: query
          required: true
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderList' }
    post:
      operationId: createOrder
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Get one order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OrderId' }
  responses:
    Unauthorized:
      description: Authentication required
    OrderNotFound:
      description: Order does not exist
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    OrderId:
      type: integer
      format: int64
      example: 202600123
    CreateOrderRequest:
      type: object
      required: [customerId, total]
      properties:
        customerId: { type: string }
        total: { type: number, format: double }
    OrderList:
      type: array
      items: { $ref: '#/components/schemas/Order' }
    Order:
      type: object
      required: [id, customerId, status, total]
      properties:
        id: { $ref: '#/components/schemas/OrderId' }
        customerId: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        updates:
          type: array
          items: { $ref: '#/components/schemas/OrderUpdate' }
        total: { type: number, format: double }
        currency: { type: string }
    OrderStatus:
      type: string
      enum: [PENDING, ACCEPTED, SHIPPED, DELIVERED, CANCELLED]
    OrderUpdate:
      type: object
      required: [updatedAt, reason]
      properties:
        reason: { type: string }
        updatedAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
