services:
  bcc:
    image: specmatic/enterprise:latest
    working_dir: /workspace
    entrypoint: ["sh", "/workspace/bcc-enterprise-demo/scripts/run-bcc.sh"]
    volumes:
      - ../:/workspace
      - ./license.txt:/specmatic/specmatic-license.txt:ro
    environment:
      SPECMATIC_LICENSE_PATH: /specmatic/specmatic-license.txt
      SPECMATIC_IN_CONTAINER: "true"
